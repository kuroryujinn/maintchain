<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#f8fafc" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">MaintChain Architecture</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#64748b">Three-tier decentralized application on Stellar Soroban</text>

  <!-- Frontend Box -->
  <rect x="50" y="90" width="800" height="140" rx="12" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="50" y="90" width="800" height="30" rx="12" fill="url(#blueGrad)"/>
  <rect x="50" y="108" width="800" height="12" fill="url(#blueGrad)"/>
  <text x="450" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="white">Frontend — Next.js 14 + React 18 + Tailwind v4</text>

  <text x="100" y="150" font-size="11" fill="#334155">• Freighter Wallet Integration</text>
  <text x="100" y="170" font-size="11" fill="#334155">• Soroban Contract Pipeline (simulate → sign → submit)</text>
  <text x="100" y="190" font-size="11" fill="#334155">• 25 Routes (Landing, Dashboard, Upload, Approve, Audit, Register, Get-Verified)</text>
  <text x="100" y="210" font-size="11" fill="#334155">• API Proxy ([...proxy]/route.ts — auth injection)</text>
  <text x="500" y="150" font-size="11" fill="#334155">• Typed API Client (fetch wrapper)</text>
  <text x="500" y="170" font-size="11" fill="#334155">• GlitchTip SDK (error tracking + Web Vitals)</text>
  <text x="500" y="190" font-size="11" fill="#334155">• PostHog Analytics (funnel tracking)</text>
  <text x="500" y="210" font-size="11" fill="#334155">• Lazy-loaded landing page (next/dynamic)</text>

  <!-- Arrows down -->
  <line x1="250" y1="230" x2="250" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="250,265 245,255 255,255" fill="#94a3b8"/>
  <text x="270" y="250" font-size="10" fill="#64748b">Soroban RPC</text>

  <line x1="650" y1="230" x2="650" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="650,265 645,255 655,255" fill="#94a3b8"/>
  <text x="670" y="250" font-size="10" fill="#64748b">HTTP (fetch → proxy)</text>

  <!-- Smart Contracts Box -->
  <rect x="50" y="260" width="380" height="140" rx="12" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="50" y="260" width="380" height="30" rx="12" fill="url(#greenGrad)"/>
  <rect x="50" y="278" width="380" height="12" fill="url(#greenGrad)"/>
  <text x="240" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="white">Smart Contracts — Stellar Soroban (Rust)</text>

  <text x="80" y="315" font-size="11" fill="#334155">• EquipmentRegistry</text>
  <text x="80" y="335" font-size="11" fill="#334155">• MaintenanceRecords</text>
  <text x="80" y="355" font-size="11" fill="#334155">• MultiPartyApproval</text>
  <text x="250" y="315" font-size="11" fill="#334155">• ComplianceAttestation</text>
  <text x="250" y="335" font-size="11" fill="#334155">• IdentityRegistry</text>
  <text x="250" y="355" font-size="11" fill="#94a3b8">5 contracts, WASM, deployed to Testnet</text>

  <!-- Backend Box -->
  <rect x="470" y="260" width="380" height="140" rx="12" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="470" y="260" width="380" height="30" rx="12" fill="#6366f1"/>
  <rect x="470" y="278" width="380" height="12" fill="#6366f1"/>
  <text x="660" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="white">Backend — Rust Axum + PostgreSQL</text>

  <text x="500" y="315" font-size="11" fill="#334155">• REST API (26 endpoints)</text>
  <text x="500" y="335" font-size="11" fill="#334155">• SEP-53 Auth (challenge-response)</text>
  <text x="500" y="355" font-size="11" fill="#334155">• Verify-only Soroban RPC client</text>
  <text x="700" y="315" font-size="11" fill="#334155">• Evidence Hashing (SHA-256)</text>
  <text x="700" y="335" font-size="11" fill="#334155">• IPFS Upload (Pinata)</text>
  <text x="700" y="355" font-size="11" fill="#334155">• GlitchTip Server Error Tracking</text>

  <!-- Arrow to database -->
  <line x1="660" y1="400" x2="660" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="660,435 655,425 665,425" fill="#94a3b8"/>

  <!-- Database Box -->
  <rect x="470" y="430" width="380" height="80" rx="12" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
  <rect x="470" y="430" width="380" height="30" rx="12" fill="#f59e0b"/>
  <rect x="470" y="448" width="380" height="12" fill="#f59e0b"/>
  <text x="660" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="white">Database — PostgreSQL 16 (Supabase)</text>
  <text x="500" y="485" font-size="11" fill="#334155">Users · Equipment · Maintenance Records · Approvals · Audit Trail · Transaction Log</text>

  <!-- CI/CD footer -->
  <rect x="50" y="530" width="800" height="80" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="450" y="555" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">CI/CD — GitHub Actions → Vercel (Frontend) + Render (Backend)</text>
  <text x="450" y="575" text-anchor="middle" font-size="11" fill="#94a3b8">Lighthouse CI (running server) · GlitchTip Source Maps · Contract Tests · Role Drift Guards</text>
  <text x="450" y="595" text-anchor="middle" font-size="11" fill="#94a3b8">PostHog Analytics · Web Vitals → GlitchTip · Bundle Analyzer (ANALYZE=true)</text>
</svg>
