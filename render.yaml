# ── MaintChain Render Blueprint ──
# Infrastructure-as-code for Render.com deployment.
# Deploy by connecting this GitHub repo to Render Blueprints.
# See: https://render.com/docs/blueprint-spec

services:
  # Backend: Rust Axum API (Docker)
  - type: web
    name: maintchain-backend
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      # ── Soroban / Stellar Configuration ──
      # The helper script path inside the Docker container:
      - key: SOROBAN_HELPER_PATH
        value: /app/scripts/soroban-invoke.mjs
      # Soroban RPC endpoint (defaults to testnet)
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      # Stellar network passphrase for transaction signing
      - key: SOROBAN_NETWORK_PASSPHRASE
        sync: false
      # ── Deployed Soroban Contract IDs ──
      # Set these in Render Dashboard → Environment Variables
      # NOTE: No secret key is needed — the backend only does read-only
      # contract simulations (no signing). All blockchain transactions
      # are signed by users' Freighter wallets via the frontend.
      - key: APPROVAL_CONTRACT_ID
        sync: false
      - key: RECORDS_CONTRACT_ID
        sync: false
      - key: ATTESTATION_CONTRACT_ID
        sync: false
      # IdentityRegistry — must match the frontend's NEXT_PUBLIC_IDENTITY_REGISTRY_ID
      # so /verification/readiness reports configured and verification rows store the
      # real contract ID instead of 'unknown'.
      - key: IDENTITY_REGISTRY_CONTRACT_ID
        sync: false
      # ── Error Tracking (GlitchTip) ──
      # Uses the same project DSN as the frontend (Sentry-compatible SDK).
      - key: GLITCHTIP_DSN
        value: https://d50984aebbe547c1af84ff919ccedb62@app.glitchtip.com/27052
      - key: GLITCHTIP_ENVIRONMENT
        value: production
      # ── Database ──
      # PostgreSQL connection string. Required for the backend to start.
      # Set in Render Dashboard → Environment Variables (contains credentials).
      - key: DATABASE_URL
        sync: false
      # ── API Authentication ──
      # Shared secret between the Next.js frontend proxy and the Rust backend.
      # Set in Render Dashboard → Environment Variables.
      - key: MAINTCHAIN_API_KEY
        sync: false
      # ── CORS Origins ──
      # Comma-separated list of allowed frontend origins.
      # Set in Render Dashboard → Environment Variables.
      - key: ALLOWED_ORIGINS
        sync: false
      # Do NOT set PORT — Render injects its own.
      # The backend reads $PORT from environment, falls back to 8081.
      # Dockerfile at repo root: build context is the repo itself.
