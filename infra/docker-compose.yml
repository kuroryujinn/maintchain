services:
  postgres:
    image: postgres:16
    container_name: maintchain-postgres
    environment:
      POSTGRES_USER: maintchain
      POSTGRES_PASSWORD: maintchain
      POSTGRES_DB: maintchain
    # Host port 5433, not 5432: a native Windows PostgreSQL service already
    # owns 5432, which shadows Docker's published port. 5433 sidesteps it.
    ports:
      - "5433:5432"
    volumes:
      - maintchain_postgres_data:/var/lib/postgresql/data

volumes:
  maintchain_postgres_data:
