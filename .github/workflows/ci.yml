# ── MaintChain CI Pipeline ──
# Runs on push to main and pull requests.
# Ensures frontend builds, backend builds, and contracts pass tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Frontend: TypeScript type-check and lint ─────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Standalone drift guard for the frontend role list vs. the DB
      # users_role_check constraint (independent of the vitest suite).
      - name: Check roles.ts matches DB role constraint
        run: node ../scripts/check-role-drift.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:8081

  # ─── Backend: Rust build ────────────────────────────
  backend:
    name: Backend (Rust Axum)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Migration placement guard: sqlx's Migrator reads ./migrations relative to
      # backend/ and the Dockerfile only copies backend/migrations/, so any migration
      # file living outside backend/migrations/ would silently never be applied.
      # Fail CI instead of letting it drift (this bit the repo with 0005_transaction_log).
      - name: Check migration files are inside backend/migrations/
        working-directory: ${{ github.workspace }}
        run: |
          misplaced=$(find . -name '*.sql' \
            -not -path './backend/migrations/*' \
            -not -path './backend/target/*' \
            -not -path './frontend/node_modules/*' | sort)
          if [ -n "$misplaced" ]; then
            echo "::error::Migration file(s) found outside backend/migrations/:"
            echo "$misplaced"
            echo "Move them into backend/migrations/ so sqlx Migrator and the Dockerfile pick them up."
            exit 1
          fi
          echo "✅ All migration files are inside backend/migrations/"

      # Migration numbering guard: sqlx applies migrations in version order, so files
      # must be zero-padded and sequential with no gaps (0001, 0002, ...). A gap means
      # later migrations would never run — fail CI instead.
      - name: Check migration files are numbered sequentially (no gaps)
        working-directory: ${{ github.workspace }}
        run: |
          cd backend/migrations
          expected=1
          for f in $(find . -maxdepth 1 -name '*.sql' | sort); do
            name=${f#./}
            case "$name" in
              [0-9][0-9][0-9][0-9]_*) ;;
              *)
                echo "::error::Migration '$name' does not match the NNNN_name.sql numbering pattern"
                exit 1
                ;;
            esac
            num=$((10#${name%%_*}))
            if [ "$num" -ne "$expected" ]; then
              echo "::error::Migration numbering gap or duplicate: expected $expected, found $num ($name)"
              echo "Migration versions must be sequential with no gaps (0001, 0002, ...)."
              exit 1
            fi
            expected=$((expected + 1))
          done
          echo "✅ Migrations are numbered sequentially through $((expected - 1))"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Check compilation
        run: cargo check --release

      - name: Build
        run: cargo build --release

  # ─── Smart Contracts: Rust WASM tests ──────────────
  contracts:
    name: Smart Contracts (Soroban)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      # Workspace guard: every contract crate directory must be a member of the
      # contracts/Cargo.toml workspace, or it is silently skipped by cargo test/build.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check workspace members match contract directories
        run: node ../scripts/check-contract-members.mjs

      # Deploy guard: every *.wasm reference in scripts/deploy-contracts.mjs must
      # map to a workspace crate, and every workspace crate must be deployed —
      # otherwise a renamed crate silently deploys stale WASM, and a new crate
      # is never deployed at all.
      - name: Check deploy-contracts.mjs references match workspace crates
        run: node ../scripts/check-deploy-contracts.mjs

      - name: Setup Rust nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32v1-none

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run contract tests
        run: cargo test

      - name: Build WASM (release)
        run: cargo build --target wasm32v1-none --release
