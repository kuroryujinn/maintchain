# ── MaintChain Deploy Pipeline ──
# Deploys to production on push to main (after CI passes).
# - Frontend → Vercel via Vercel CLI (prebuilt flow)
# - Backend → Render.com via Deploy Hook webhook
#
# Prerequisites:
#   Frontend: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub secrets
#   Backend:  RENDER_DEPLOY_HOOK_URL in GitHub secrets

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  # ─── Deploy Frontend to Vercel ─────────────────────
  frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ─── Vercel Prebuilt Deployment Flow ────────────────
      # Vercel project settings (Root Directory: frontend) route
      # all CLI commands to frontend/ automatically. No --cwd needed.
      # Environment variables (NEXT_PUBLIC_*) are fetched from Vercel
      # project settings via `vercel pull`, so ensure they are
      # configured there for the Production environment.

      - name: Pull Vercel Environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Upload source maps to GlitchTip for readable stack traces
      # Requires GLITCHTIP_AUTH_TOKEN in GitHub secrets
      - name: Upload source maps to GlitchTip
        if: env.GLITCHTIP_AUTH_TOKEN != ''
        run: |
          npx --yes @glitchtip/cli@latest sourcemaps inject .next
          npx --yes @glitchtip/cli@latest sourcemaps upload .next \
            --org maintchain \
            --project maintchain-frontend \
            --release "${{ github.sha }}"
        env:
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          GLITCHTIP_HOST: https://app.glitchtip.com

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── Deploy Backend to Render ──────────────────────
  backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set — skipping backend deployment"
            exit 0
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "::notice::Render deploy hook triggered successfully"
