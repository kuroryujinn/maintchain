# MaintChain Production Smoke Test
# Manual or scheduled production verification.
#
# This workflow runs the complete smoke test suite against the deployed production application.
# It does NOT deploy or modify the production environment.
#
# Usage:
#   1. Manual: Actions → Production Smoke Test → Run workflow
#   2. Scheduled: Weekly on Sundays at 06:00 UTC
#   3. After deployment: Trigger manually

name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Production URL to test'
        required: false
        default: 'https://maintchain.vercel.app'
      enable_blockchain:
        description: 'Enable blockchain write tests (testnet only)'
        required: false
        type: boolean
        default: false
      enable_browser:
        description: 'Enable Playwright browser tests'
        required: false
        type: boolean
        default: true
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'

jobs:
  http-smoke-test:
    name: HTTP Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run HTTP smoke tests
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://maintchain.vercel.app' }}
          SMOKE_ENVIRONMENT: production
          SMOKE_NETWORK: testnet
          SMOKE_TIMEOUT: '30000'
          SMOKE_ENABLE_BLOCKCHAIN: ${{ inputs.enable_blockchain || 'false' }}
          SMOKE_ENABLE_ANALYTICS: 'true'
          SMOKE_ENABLE_TELEMETRY: 'true'
        run: node tests/smoke/smoke-runner.mjs

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-smoke-report-${{ github.run_id }}
          path: tests/smoke/smoke-report.json
          retention-days: 30

      - name: Report result
        if: always()
        run: |
          if [ -f tests/smoke/smoke-report.json ]; then
            echo "## HTTP Smoke Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat tests/smoke/smoke-report.json | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('/dev/stdin', 'utf8'));
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Run ID | ' + data.runId + ' |');
              console.log('| Target | ' + data.baseUrl + ' |');
              console.log('| Duration | ' + data.duration + 'ms |');
              console.log('| Passed | ' + data.summary.passed + ' |');
              console.log('| Failed | ' + data.summary.failed + ' |');
              console.log('| Skipped | ' + data.summary.skipped + ' |');
              console.log('| Blocked | ' + data.summary.blocked + ' |');
              console.log('| Result | **' + data.finalResult + '** |');
            " >> $GITHUB_STEP_SUMMARY
          fi

  browser-smoke-test:
    name: Browser Smoke Test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.enable_browser != false }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run Playwright browser smoke tests
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://maintchain.vercel.app' }}
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/tests/smoke/playwright-report.json
          retention-days: 30

      - name: Report browser test result
        if: always()
        run: |
          echo "## Browser Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/tests/smoke/playwright-report.json ]; then
            cat frontend/tests/smoke/playwright-report.json | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('/dev/stdin', 'utf8'));
              const suites = data.suites || [];
              let passed = 0, failed = 0, skipped = 0;
              function count(specs) {
                for (const s of specs) {
                  if (s.tests) for (const t of s.tests) {
                    for (const r of (t.results || [])) {
                      if (r.status === 'passed') passed++;
                      else if (r.status === 'failed' || r.status === 'timedOut') failed++;
                      else skipped++;
                    }
                  }
                }
              }
              for (const suite of suites) {
                count(suite.specs || []);
                for (const child of (suite.suites || [])) count(child.specs || []);
              }
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              console.log('| Passed | ' + passed + ' |');
              console.log('| Failed | ' + failed + ' |');
              console.log('| Skipped | ' + skipped + ' |');
              console.log('| Result | **' + (failed === 0 ? 'PASS' : 'FAIL') + '** |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No Playwright report found." >> $GITHUB_STEP_SUMMARY
          fi
